<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/minhascifras-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App de cifras com setlists, acordes editáveis, karaokê e modo 100% offline.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Minhas Cifras">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Minhas Cifras</title>
  <link rel="manifest" href="manifest.json">

  <style>
    @font-face {
      font-family: 'Roboto';
      src: url('assets/fonts/Roboto-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Roboto';
      src: url('assets/fonts/Roboto-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Roboto';
      src: url('assets/fonts/Roboto-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'MaterialIcons';
      src: url('assets/fonts/MaterialIcons-Regular.otf') format('opentype');
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0e0f17;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #1e1f33 0%, #0e0f17 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out;
      pointer-events: none;
    }
    .loading-logo {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(124, 77, 255, 0.4);
      animation: pulse 2.2s infinite ease-in-out;
    }
    .loading-spinner {
      margin-top: 24px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #9d4edd;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    .loading-title {
      margin-top: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.88; }
    }
  </style>
</head>
<body tabindex="0">
  <!-- Sink invisível para manter canal de teclado Bluetooth ativo no Safari/iPadOS mesmo sem teclado físico -->
  <input id="pedal-keyboard-sink" type="text" inputmode="none" tabindex="0" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0.01; border:none; z-index:1000; background:transparent; padding:0; margin:0;" />

  <!-- Tela de inicialização suave (Dark Splash) para evitar qualquer tela branca em celulares -->
  <div id="loading-screen">
    <img class="loading-logo" src="icons/Icon-192.png" alt="Minhas Cifras" />
    <div class="loading-title">Minhas Cifras</div>
    <div class="loading-spinner"></div>
    <div class="loading-sub">Carregando repertório...</div>
  </div>

  <script>
    function dismissLoadingScreen() {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', dismissLoadingScreen);
  </script>

  <!-- Service Worker para funcionamento 100% offline e Atualização Automática Silenciosa -->
  <script>
    (function() {
      window.minhasCifrasBuildVersion = 'main-1794245657';

      // Atualização "de verdade": remove Service Workers e caches e recarrega da rede.
      window.mcHardUpdate = function() {
        var tasks = [];
        try {
          if ('serviceWorker' in navigator) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs) {
              return Promise.all(rs.map(function(r) { return r.unregister(); }));
            }));
          }
          if (window.caches) {
            tasks.push(caches.keys().then(function(ks) {
              return Promise.all(ks.map(function(k) { return caches.delete(k); }));
            }));
          }
        } catch (e) {}
        return Promise.all(tasks).catch(function() {}).then(function() {
          window.location.replace(window.location.pathname + '?v=' + Date.now() + window.location.hash);
        });
      };
      // Remove o parâmetro ?v= da URL depois de recarregar
      if (window.location.search.indexOf('v=') >= 0) {
        try { history.replaceState(null, '', window.location.pathname + window.location.hash); } catch (e) {}
      }
      window.mcRunningBuild = function() {
        var v = (window.minhasCifrasBuildVersion || '').toString();
        return v.indexOf('__') === 0 ? '' : v;
      };
      var swRegistration = null;

      if ('serviceWorker' in navigator) {
        // Quando o novo Service Worker assumir o controle (activate + clients.claim):
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          console.log('[MinhasCifras] Novo Service Worker assumiu o controle. Atualizando aplicação...');
          window.location.reload();
        });

        // Registra o Service Worker com URL canônica e updateViaCache: 'none' (força bypass de HTTP cache)
        navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
          .then(function(reg) {
            swRegistration = reg;
            console.log('[MinhasCifras] Service Worker offline ativo:', reg.scope);

            // Ativa qualquer worker em espera
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

            // Força verificação imediata na rede
            reg.update().catch(function() {});

            reg.onupdatefound = function() {
              var installing = reg.installing;
              if (installing) {
                installing.onstatechange = function() {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[MinhasCifras] Nova versão instalada. Atualizando...');
                    if (installing.postMessage) {
                      installing.postMessage({ type: 'SKIP_WAITING' });
                    }
                    window.location.reload();
                  }
                };
              }
            };
          })
          .catch(function(err) {
            console.warn('[MinhasCifras] Falha ao registrar Service Worker:', err);
          });

        // Verificação imediata no version.json: compara com a versão realmente em execução
        if (navigator.onLine) {
          fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
              var serverBuild = (data.buildVersion || data.version || '').toString();
              var running = window.mcRunningBuild();
              if (serverBuild && running && serverBuild !== running) {
                // Evita laço de recarga: tenta no máximo uma vez por versão de servidor
                var tried = sessionStorage.getItem('mc_auto_update_for');
                if (tried !== serverBuild) {
                  sessionStorage.setItem('mc_auto_update_for', serverBuild);
                  console.log('[MinhasCifras] Nova versão:', serverBuild, 'em execução:', running);
                  window.mcHardUpdate();
                }
              }
            })
            .catch(function() {});
        }

        // Recheca novas versões quando o usuário reabrir ou focar o app PWA
        function checkForUpdatesOnResume() {
          if (swRegistration && navigator.onLine) {
            swRegistration.update().catch(function() {});
          }
          if (localStorage.getItem('mc_pending_update') === 'true') {
            localStorage.removeItem('mc_pending_update');
            window.location.reload();
          }
        }

        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
            checkForUpdatesOnResume();
          }
        });
        window.addEventListener('pageshow', checkForUpdatesOnResume);
        window.addEventListener('focus', checkForUpdatesOnResume);
        window.addEventListener('online', checkForUpdatesOnResume);

        // Exposição para acionamento via Dart ao iniciar o app
        window.forcarAtualizacaoPwa = function() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(function(reg) {
              if (reg) {
                reg.update().catch(function() {});
                if (reg.waiting) {
                  reg.waiting.postMessage({type: 'SKIP_WAITING'});
                }
              }
            }).catch(function() {});
          }
        };

        // Checagem periódica silenciosa a cada 10 minutos
        setInterval(function() {
          if (swRegistration && navigator.onLine) {
            swRegistration.update().catch(function() {});
          }
        }, 10 * 60 * 1000);
      }

      // --- Proteção contra Bloqueio de Tela (Screen Wake Lock API) ---
      var wakeLockEnabled = true;
      var wakeLockSentinel = null;

      async function requestScreenWakeLock() {
        if (!wakeLockEnabled) return;
        if (!('wakeLock' in navigator)) return;
        try {
          if (wakeLockSentinel && !wakeLockSentinel.released) return;
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', function() {
            wakeLockSentinel = null;
            if (wakeLockEnabled && document.visibilityState === 'visible') {
              requestScreenWakeLock();
            }
          });
        } catch (e) {}
      }

      window.setMinhasCifrasWakeLock = function(enable) {
        wakeLockEnabled = !!enable;
        if (wakeLockEnabled) {
          requestScreenWakeLock();
        } else if (wakeLockSentinel) {
          try { wakeLockSentinel.release(); } catch (e) {}
          wakeLockSentinel = null;
        }
      };

      // --- Interceptador Universal de Pedal Bluetooth (M-VAVE VAVE368, PageFlip, AirTurn, Donner) ---
      // Princípios:
      //  1) Captura em window (fase capture) para keydown E keyup (fallback), sem depender de foco do Flutter.
      //  2) NUNCA intercepta teclas quando o usuário digita em um campo de texto real (busca, login...).
      //  3) Cada pressionamento físico gera no máximo UMA ação (dedupe por evento e por tempo).
      //  4) O campo invisível "pedal-keyboard-sink" mantém o canal de teclado Bluetooth ativo no iPadOS.
      window.dispatchPedalAction = null;
      window._lastPedalDebug = '';
      var lastPedalTime = 0;
      var lastPedalAction = '';
      var lastKeyDownAt = 0;

      function isRealTextTarget(t) {
        if (!t || t.id === 'pedal-keyboard-sink') return false;
        var tag = (t.tagName || '').toUpperCase();
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
        if (t.isContentEditable) return true;
        return false;
      }

      function ensurePedalFocus() {
        var sink = document.getElementById('pedal-keyboard-sink');
        if (!sink) return;
        var active = document.activeElement;
        // Não rouba foco se o usuário estiver digitando em campo de texto real (busca, etc.)
        if (active && active !== sink && active !== document.body) {
          if (isRealTextTarget(active)) return;
          if (active.className && String(active.className).indexOf('flt-text-editing') !== -1) return;
        }
        if (document.activeElement !== sink) {
          try { sink.focus({ preventScroll: true }); } catch (e) {}
        }
      }

      window.addEventListener('refocuspedal', ensurePedalFocus);

      function mapPedalAction(key, code, keyCode) {
        // Próxima Música (ArrowRight, Numpad 6, ']', KeyCode 39, 102, 221)
        if (key === 'ArrowRight' || code === 'ArrowRight' || keyCode === 39 || keyCode === 102 || keyCode === 221 || key === ']') return 'next';
        // Música Anterior (ArrowLeft, Numpad 4, '[', KeyCode 37, 100, 219)
        if (key === 'ArrowLeft' || code === 'ArrowLeft' || keyCode === 37 || keyCode === 100 || keyCode === 219 || key === '[') return 'prev';
        // Rolar para Baixo (PageDown, ArrowDown, Numpad 2/3, 'b')
        if (key === 'PageDown' || code === 'PageDown' || key === 'ArrowDown' || code === 'ArrowDown' || keyCode === 34 || keyCode === 40 || keyCode === 98 || keyCode === 99 || keyCode === 66 || key === 'b' || key === 'B') return 'down';
        // Rolar para Cima (PageUp, ArrowUp, Numpad 8/9, 'w')
        if (key === 'PageUp' || code === 'PageUp' || key === 'ArrowUp' || code === 'ArrowUp' || keyCode === 33 || keyCode === 38 || keyCode === 104 || keyCode === 105 || keyCode === 87 || key === 'w' || key === 'W') return 'up';
        // Espaço (Modo 4)
        if (key === ' ' || code === 'Space' || keyCode === 32) return 'space';
        // Enter (Modo 4)
        if (key === 'Enter' || code === 'Enter' || code === 'NumpadEnter' || keyCode === 13) return 'enter';
        return null;
      }

      function emitDebug(obj) {
        obj.time = new Date().toLocaleTimeString();
        var payload = JSON.stringify(obj);
        window._lastPedalDebug = payload;
        window.dispatchEvent(new CustomEvent('pedaldebug', { detail: payload }));
      }

      function fireAction(action, source, e) {
        var now = Date.now();
        var debounceMs = (action === 'down' || action === 'up') ? 200 : 500;
        if ((now - lastPedalTime) < debounceMs) {
          if (e) { e.preventDefault(); e.stopPropagation(); }
          return;
        }
        lastPedalTime = now;
        lastPedalAction = action;
        if (e) { e.preventDefault(); e.stopPropagation(); }
        var sinkEl = document.getElementById('pedal-keyboard-sink');
        if (sinkEl) sinkEl.value = '';
        window.dispatchEvent(new CustomEvent('pedalaction', { detail: action }));
        setTimeout(ensurePedalFocus, 50);
      }

      function processKeyEvent(e) {
        if (e.__mcHandled) return;
        e.__mcHandled = true;

        // Digitação em campo de texto real: não interceptar NADA (permite digitar b, w, espaço, setas...)
        if (isRealTextTarget(e.target)) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;

        var key = e.key || '';
        var code = e.code || '';
        var keyCode = e.keyCode || e.which || 0;
        var isUp = e.type === 'keyup';
        var action = mapPedalAction(key, code, keyCode);

        if (isUp) {
          // keyup só vale como fallback quando o keydown correspondente NUNCA chegou (alguns HID do iOS)
          if (!action || (Date.now() - lastKeyDownAt) < 900) return;
        } else {
          lastKeyDownAt = Date.now();
        }

        emitDebug({ type: e.type, key: key, code: code, keyCode: keyCode, action: action || 'nenhuma' });
        if (action) fireAction(action, e.type, e);
      }

      // Escuta em window e document (capture) para keydown e keyup
      ['keydown', 'keyup'].forEach(function(evt) {
        window.addEventListener(evt, processKeyEvent, { capture: true, passive: false });
        document.addEventListener(evt, processKeyEvent, { capture: true, passive: false });
      });

      var sinkEl = document.getElementById('pedal-keyboard-sink');
      if (sinkEl) {
        sinkEl.addEventListener('blur', function() {
          var active = document.activeElement;
          if (active && active !== sinkEl && isRealTextTarget(active)) return;
          try { sinkEl.focus({ preventScroll: true }); } catch (e) {}
        });
        // Fallback: alguns pedais chegam apenas como texto digitado ("b", "w", "[", "]", " ")
        sinkEl.addEventListener('input', function(ev) {
          var data = (ev && ev.data) || sinkEl.value || '';
          sinkEl.value = '';
          if (!data) return;
          var ch = data.slice(-1);
          var action = mapPedalAction(ch, '', 0);
          emitDebug({ type: 'input', key: ch, code: '', keyCode: 0, action: action || 'nenhuma' });
          if (action) fireAction(action, 'input', null);
        });
      }

      window.addEventListener('focusout', function() {
        var active = document.activeElement;
        if (isRealTextTarget(active)) return;
        var s = document.getElementById('pedal-keyboard-sink');
        if (s && document.activeElement !== s) {
          try { s.focus({ preventScroll: true }); } catch (e) {}
        }
      });

      setInterval(function() {
        if (!document.activeElement || document.activeElement === document.body) {
          ensurePedalFocus();
        }
      }, 800);

      // Suporte ao Modo Mouse do M-VAVE (Modo 4): botão direito -> Próxima, botão do meio/lateral -> Anterior/Próxima
      window.addEventListener('contextmenu', function(e) {
        if (isRealTextTarget(e.target)) return;
        emitDebug({ type: 'mouse_context', key: '', code: '', keyCode: 0, action: 'next' });
        e.preventDefault();
        e.stopPropagation();
        fireAction('next', 'contextmenu', null);
      }, { capture: true, passive: false });

      window.addEventListener('auxclick', function(e) {
        var action = null;
        if (e.button === 1 || e.button === 3) action = 'prev';
        else if (e.button === 4) action = 'next';
        if (!action) return;
        e.preventDefault();
        e.stopPropagation();
        emitDebug({ type: 'mouse_aux', key: '', code: '', keyCode: e.button, action: action });
        fireAction(action, 'auxclick', null);
      }, { capture: true, passive: false });

      // Reassume o canal do pedal sempre que o app volta ao primeiro plano
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          if (wakeLockEnabled) requestScreenWakeLock();
          ensurePedalFocus();
        }
      });
      window.addEventListener('pageshow', ensurePedalFocus);
      window.addEventListener('focus', ensurePedalFocus);

      // Gestos do usuário são o único momento em que o iOS permite focar o campo: aproveitamos todos
      ['touchstart', 'touchend', 'click', 'pointerup'].forEach(function(evt) {
        document.addEventListener(evt, function(e) {
          if (isRealTextTarget(e.target)) return;
          ensurePedalFocus();
          if (wakeLockEnabled && (!wakeLockSentinel || wakeLockSentinel.released)) {
            requestScreenWakeLock();
          }
        }, { passive: true, capture: true });
      });

      setTimeout(ensurePedalFocus, 800);
      window.addEventListener('flutter-first-frame', function() {
        setTimeout(ensurePedalFocus, 300);
      });
      requestScreenWakeLock();
    })();
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
