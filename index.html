<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for

    For more details:

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.

  <base href="/minhascifras-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App de cifras com setlists, acordes editáveis, karaokê e modo 100% offline.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Minhas Cifras">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Minhas Cifras</title>
  <link rel="manifest" href="manifest.json">

  <style>
    @font-face {
      font-family: 'Roboto';
      src: url('assets/fonts/Roboto-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: 'Roboto';
      src: url('assets/fonts/Roboto-Medium.ttf') format('truetype');
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Roboto';
      src: url('assets/fonts/Roboto-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'MaterialIcons';
      src: url('assets/fonts/MaterialIcons-Regular.otf') format('opentype');
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0e0f17;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #1e1f33 0%, #0e0f17 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out;
      pointer-events: none;
    }
    .loading-logo {
      width: 76px;
      height: 76px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(124, 77, 255, 0.4);
      animation: pulse 2.2s infinite ease-in-out;
    }
    .loading-spinner {
      margin-top: 24px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.12);
      border-top-color: #9d4edd;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    .loading-title {
      margin-top: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.88; }
    }
  </style>
</head>
<body tabindex="0">
  <!-- Sink invisível para manter canal de teclado Bluetooth ativo no Safari/iPadOS mesmo sem teclado físico -->
  <input id="pedal-keyboard-sink" type="text" inputmode="none" tabindex="0" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="position:fixed; bottom:0; right:0; width:1px; height:1px; opacity:0.01; border:none; z-index:1; background:transparent; padding:0; margin:0; pointer-events:none;" />

  <!-- Tela de inicialização suave (Dark Splash) para evitar qualquer tela branca em celulares -->
  <div id="loading-screen">
    <img class="loading-logo" src="icons/Icon-192.png" alt="Minhas Cifras" />
    <div class="loading-title">Minhas Cifras</div>
    <div class="loading-spinner"></div>
    <div class="loading-sub">Carregando repertório...</div>
  </div>

  <script>
    function dismissLoadingScreen() {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', dismissLoadingScreen);
  </script>

  <!-- Service Worker para funcionamento 100% offline e Atualização Automática Silenciosa -->
  <script>
    (function() {
      window.minhasCifrasBuildVersion = 'main-1794233387';
      var swRegistration = null;
      var hasReloadedThisSession = sessionStorage.getItem('mc_reloaded_for_update') === 'true';

      if ('serviceWorker' in navigator) {
        // Quando o novo Service Worker assumir o controle (activate + clients.claim):
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          console.log('[MinhasCifras] Novo Service Worker assumiu o controle. Forçando atualização...');
          if (!hasReloadedThisSession) {
            sessionStorage.setItem('mc_reloaded_for_update', 'true');
            window.location.reload();
          }
        });

        // Registra o Service Worker com URL canônica e updateViaCache: 'none' (força bypass de HTTP cache)
        navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
          .then(function(reg) {
            swRegistration = reg;
            console.log('[MinhasCifras] Service Worker offline ativo:', reg.scope);

            // Ativa qualquer worker em espera
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

            // Força verificação imediata na rede
            reg.update().catch(function() {});

            reg.onupdatefound = function() {
              var installing = reg.installing;
              if (installing) {
                installing.onstatechange = function() {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[MinhasCifras] Nova versão pronta. Forçando atualização...');
                    if (!hasReloadedThisSession) {
                      sessionStorage.setItem('mc_reloaded_for_update', 'true');
                      if (installing.postMessage) {
                        installing.postMessage({ type: 'SKIP_WAITING' });
                      }
                      window.location.reload();
                    }
                  }
                };
              }
            };
          })
          .catch(function(err) {
            console.warn('[MinhasCifras] Falha ao registrar Service Worker:', err);
          });

        // Recheca novas versões quando o usuário reabrir ou focar o app PWA
        function checkForUpdatesOnResume() {
          if (swRegistration && navigator.onLine) {
            swRegistration.update().catch(function() {});
          }
          if (localStorage.getItem('mc_pending_update') === 'true' && !hasReloadedThisSession) {
            localStorage.removeItem('mc_pending_update');
            sessionStorage.setItem('mc_reloaded_for_update', 'true');
            window.location.reload();
          }
        }

        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
            checkForUpdatesOnResume();
          }
        });
        window.addEventListener('pageshow', checkForUpdatesOnResume);
        window.addEventListener('focus', checkForUpdatesOnResume);
        window.addEventListener('online', checkForUpdatesOnResume);

        // Exposição para acionamento via Dart ao iniciar o app
        window.forcarAtualizacaoPwa = function() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(function(reg) {
              if (reg) {
                reg.update().catch(function() {});
                if (reg.waiting) {
                  reg.waiting.postMessage({type: 'SKIP_WAITING'});
                }
              }
            }).catch(function() {});
          }
        };

        // Checagem periódica silenciosa a cada 10 minutos
        setInterval(function() {
          if (swRegistration && navigator.onLine) {
            swRegistration.update().catch(function() {});
          }
        }, 10 * 60 * 1000);
      }

      // --- Proteção contra Bloqueio de Tela (Screen Wake Lock API) ---
      var wakeLockEnabled = true;
      var wakeLockSentinel = null;

      async function requestScreenWakeLock() {
        if (!wakeLockEnabled) return;
        if (!('wakeLock' in navigator)) return;
        try {
          if (wakeLockSentinel && !wakeLockSentinel.released) return;
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', function() {
            wakeLockSentinel = null;
            if (wakeLockEnabled && document.visibilityState === 'visible') {
              requestScreenWakeLock();
            }
          });
        } catch (e) {}
      }

      window.setMinhasCifrasWakeLock = function(enable) {
        wakeLockEnabled = !!enable;
        if (wakeLockEnabled) {
          requestScreenWakeLock();
        } else if (wakeLockSentinel) {
          try { wakeLockSentinel.release(); } catch (e) {}
          wakeLockSentinel = null;
        }
      };

      // --- Interceptador Universal de Pedal Bluetooth (M-VAVE VAVE368, PageFlip, AirTurn, Donner) ---
      window.dispatchPedalAction = null;
      window._lastPedalDebug = '';
      var lastPedalTime = 0;
      var lastPedalAction = '';

      function ensurePedalFocus() {
        var sink = document.getElementById('pedal-keyboard-sink');
        if (!sink) return;
        var active = document.activeElement;
        // Não rouba foco se o usuário estiver digitando em campo de texto real (busca, etc.)
        if (active && active !== sink && active !== document.body) {
          if (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA') return;
          if (active.isContentEditable) return;
          if (active.className && String(active.className).indexOf('flt-text-editing') !== -1) return;
        }
        if (document.activeElement !== sink) {
          try { sink.focus({ preventScroll: true }); } catch (e) {}
        }
      }

      function processKeyEvent(e) {
        var key = e.key || '';
        var code = e.code || '';
        var keyCode = e.keyCode || e.which || 0;
        var action = null;

        // Próxima Música (Modo 1 M-Vave ⇆: ArrowRight, Numpad 6, Chave ']', KeyCode 39, 102, 221)
        if (key === 'ArrowRight' || code === 'ArrowRight' || keyCode === 39 || keyCode === 102 || keyCode === 221 || key === ']') {
          action = 'next';
        }
        // Música Anterior (Modo 1 M-Vave ⇆: ArrowLeft, Numpad 4, Chave '[', KeyCode 37, 100, 219)
        else if (key === 'ArrowLeft' || code === 'ArrowLeft' || keyCode === 37 || keyCode === 100 || keyCode === 219 || key === '[') {
          action = 'prev';
        }
        // Rolar para Baixo (Modo 2 ou 3: PageDown, ArrowDown, Numpad 2/3, Tecla 'b', KeyCode 34, 40, 98, 99, 66)
        else if (key === 'PageDown' || code === 'PageDown' || key === 'ArrowDown' || code === 'ArrowDown' || keyCode === 34 || keyCode === 40 || keyCode === 98 || keyCode === 99 || keyCode === 66 || key === 'b' || key === 'B') {
          action = 'down';
        }
        // Rolar para Cima (Modo 2 ou 3: PageUp, ArrowUp, Numpad 8/9, Tecla 'w', KeyCode 33, 38, 104, 105, 87)
        else if (key === 'PageUp' || code === 'PageUp' || key === 'ArrowUp' || code === 'ArrowUp' || keyCode === 33 || keyCode === 38 || keyCode === 104 || keyCode === 105 || keyCode === 87 || key === 'w' || key === 'W') {
          action = 'up';
        }
        // Espaço (Modo 4: KeyCode 32)
        else if (key === ' ' || code === 'Space' || keyCode === 32) {
          action = 'space';
        }
        // Enter (Modo 4: KeyCode 13)
        else if (key === 'Enter' || code === 'Enter' || code === 'NumpadEnter' || keyCode === 13) {
          action = 'enter';
        }

        var now = Date.now();
        var debugObj = {
          type: 'key',
          key: key,
          code: code,
          keyCode: keyCode,
          action: action || 'nenhuma',
          time: new Date().toLocaleTimeString()
        };
        var debugPayload = JSON.stringify(debugObj);
        window._lastPedalDebug = debugPayload;
        window.dispatchEvent(new CustomEvent('pedaldebug', { detail: debugPayload }));

        if (action) {
          var debounceMs = (action === 'down' || action === 'up') ? 200 : 500;
          if ((now - lastPedalTime) < debounceMs) {
            e.preventDefault();
            e.stopPropagation();
            return;
          }
          lastPedalTime = now;
          lastPedalAction = action;

          e.preventDefault();
          e.stopPropagation();
          var sinkEl = document.getElementById('pedal-keyboard-sink');
          if (sinkEl) sinkEl.value = '';
          window.dispatchEvent(new CustomEvent('pedalaction', { detail: action }));
          setTimeout(ensurePedalFocus, 50);
        }
      }

      // Escuta tanto em window quanto diretamente no sink para captura contínua no Safari
      window.addEventListener('keydown', processKeyEvent, { capture: true, passive: false });
      var sinkEl = document.getElementById('pedal-keyboard-sink');
      if (sinkEl) {
        sinkEl.addEventListener('keydown', processKeyEvent, { capture: true, passive: false });
        sinkEl.addEventListener('blur', function() {
          setTimeout(ensurePedalFocus, 50);
        });
        sinkEl.addEventListener('input', function() {
          sinkEl.value = '';
        });
      }

      setInterval(function() {
        if (!document.activeElement || document.activeElement === document.body) {
          ensurePedalFocus();
        }
      }, 1000);

      // Suporte ao Modo Mouse do M-VAVE (Modo 4):
      // Botão Direito do mouse (contextmenu / button === 2) -> Próxima Música
      window.addEventListener('contextmenu', function(e) {
        var active = document.activeElement;
        var tag = active ? (active.tagName || '').toUpperCase() : '';
        if ((tag === 'INPUT' && active.id !== 'pedal-keyboard-sink') || tag === 'TEXTAREA') return;

        var debugObj = {
          type: 'mouse_context',
          button: 2,
          action: 'next',
          time: new Date().toLocaleTimeString()
        };
        var debugPayload = JSON.stringify(debugObj);
        window._lastPedalDebug = debugPayload;
        window.dispatchEvent(new CustomEvent('pedaldebug', { detail: debugPayload }));

        e.preventDefault();
        e.stopPropagation();
        window.dispatchEvent(new CustomEvent('pedalaction', { detail: 'next' }));
      }, { capture: true, passive: false });

      window.addEventListener('auxclick', function(e) {
        if (e.button === 1) { // Middle click -> Música Anterior
          e.preventDefault();
          e.stopPropagation();
          window.dispatchEvent(new CustomEvent('pedalaction', { detail: 'prev' }));
        } else if (e.button === 3) {
          e.preventDefault();
          window.dispatchEvent(new CustomEvent('pedalaction', { detail: 'prev' }));
        } else if (e.button === 4) {
          e.preventDefault();
          window.dispatchEvent(new CustomEvent('pedalaction', { detail: 'next' }));
        }
      }, { capture: true, passive: false });

      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible' && wakeLockEnabled) {
          requestScreenWakeLock();
          ensurePedalFocus();
        }
      });

      ['touchstart', 'pointerdown', 'click', 'keydown'].forEach(function(evt) {
        document.addEventListener(evt, function() {
          ensurePedalFocus();
          if (wakeLockEnabled && (!wakeLockSentinel || wakeLockSentinel.released)) {
            requestScreenWakeLock();
          }
        }, { passive: true, capture: true });
      });

      setTimeout(ensurePedalFocus, 800);
      window.addEventListener('flutter-first-frame', function() {
        setTimeout(ensurePedalFocus, 300);
      });
      requestScreenWakeLock();
    })();
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
</html>
