  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    @font-face {
      font-family: 'Roboto';
      src: url('assets/fonts/Roboto-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {

      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: 'Roboto';
      src: url('assets/fonts/Roboto-Bold.ttf') format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    @font-face {
      font-family: 'MaterialIcons';
      src: url('assets/fonts/MaterialIcons-Regular.otf') format('opentype');
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0e0f17;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #1e1f33 0%, #0e0f17 100%);
      z-index: 99999;
      transition: opacity 0.4s ease-out;

    .loading-logo {
      width: 76px;

      margin-top: 24px;

      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.12);

      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    .loading-title {
      margin-top: 16px;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 0.5px;
    }
    .loading-sub {
      margin-top: 6px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.6);
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: 0.88; }
    }

</head>
<body>
  <!-- Receptor de texto oculto com "Teste" e cursor no meio ("Te|ste", índice 2) para capturar pedais Bluetooth no iPadOS (Safari e PWA) mesmo sem teclado físico -->
  <input id="pedal-keyboard-sink" type="text" inputmode="none" value="Teste" tabindex="-1" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="position:fixed; top:0; left:0; width:80px; height:24px; font-size:16px; opacity:0.01; color:transparent; background:transparent; border:none; outline:none; z-index:-1; pointer-events:none; padding:0; margin:0;" />

  <!-- Tela de inicialização suave (Dark Splash) para evitar qualquer tela branca em celulares -->
  <div id="loading-screen">
    <img class="loading-logo" src="icons/Icon-192.png" alt="Minhas Cifras" />
    <div class="loading-title">Minhas Cifras</div>
    <div class="loading-spinner"></div>
    <div class="loading-sub">Carregando repertório...</div>
  </div>

  <script>
    function dismissLoadingScreen() {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 400);
      }
    }
    window.addEventListener('flutter-first-frame', dismissLoadingScreen);
  </script>

  <!-- Service Worker para funcionamento 100% offline e Atualização Automática Silenciosa -->
  <script>
    (function() {
      window.minhasCifrasBuildVersion = 'main-1794247355';

      // Atualização "de verdade": remove Service Workers e caches e recarrega da rede.
      window.mcHardUpdate = function() {
        var tasks = [];
        try {
          if ('serviceWorker' in navigator) {
            tasks.push(navigator.serviceWorker.getRegistrations().then(function(rs) {
              return Promise.all(rs.map(function(r) { return r.unregister(); }));
            }));
          }
          if (window.caches) {
            tasks.push(caches.keys().then(function(ks) {
              return Promise.all(ks.map(function(k) { return caches.delete(k); }));
            }));
          }
        } catch (e) {}
        return Promise.all(tasks).catch(function() {}).then(function() {
          window.location.replace(window.location.pathname + '?v=' + Date.now() + window.location.hash);
        });
      };
      // Remove o parâmetro ?v= da URL depois de recarregar
      if (window.location.search.indexOf('v=') >= 0) {
        try { history.replaceState(null, '', window.location.pathname + window.location.hash); } catch (e) {}
      }
      window.mcRunningBuild = function() {
        var v = (window.minhasCifrasBuildVersion || '').toString();
        return v.indexOf('__') === 0 ? '' : v;
      };
      var swRegistration = null;

      if ('serviceWorker' in navigator) {
        // Quando o novo Service Worker assumir o controle (activate + clients.claim):
        navigator.serviceWorker.addEventListener('controllerchange', function() {
          console.log('[MinhasCifras] Novo Service Worker assumiu o controle. Atualizando aplicação...');
          window.location.reload();
        });

        // Registra o Service Worker com URL canônica e updateViaCache: 'none' (força bypass de HTTP cache)
        navigator.serviceWorker.register('sw.js', { scope: './', updateViaCache: 'none' })
          .then(function(reg) {
            swRegistration = reg;
            console.log('[MinhasCifras] Service Worker offline ativo:', reg.scope);

            // Ativa qualquer worker em espera
            if (reg.waiting) {
              reg.waiting.postMessage({ type: 'SKIP_WAITING' });
            }

            // Força verificação imediata na rede
            reg.update().catch(function() {});

            reg.onupdatefound = function() {
              var installing = reg.installing;
              if (installing) {
                installing.onstatechange = function() {
                  if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                    console.log('[MinhasCifras] Nova versão instalada. Atualizando...');
                    if (installing.postMessage) {
                      installing.postMessage({ type: 'SKIP_WAITING' });
                    }
                    window.location.reload();
                  }
                };
              }
            };
          })
          .catch(function(err) {
            console.warn('[MinhasCifras] Falha ao registrar Service Worker:', err);
          });

        // Verificação imediata no version.json: compara com a versão realmente em execução
        if (navigator.onLine) {
          fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
            .then(function(res) { return res.json(); })
            .then(function(data) {
              var serverBuild = (data.buildVersion || data.version || '').toString();
              var running = window.mcRunningBuild();
              if (serverBuild && running && serverBuild !== running) {
                // Evita laço de recarga: tenta no máximo uma vez por versão de servidor
                var tried = sessionStorage.getItem('mc_auto_update_for');
                if (tried !== serverBuild) {
                  sessionStorage.setItem('mc_auto_update_for', serverBuild);
                  console.log('[MinhasCifras] Nova versão:', serverBuild, 'em execução:', running);
                  window.mcHardUpdate();
                }
              }
            })
            .catch(function() {});
        }

        // Recheca novas versões quando o usuário reabrir ou focar o app PWA
        function checkForUpdatesOnResume() {
          if (swRegistration && navigator.onLine) {
            swRegistration.update().catch(function() {});
          }
          if (localStorage.getItem('mc_pending_update') === 'true') {
            localStorage.removeItem('mc_pending_update');
            window.location.reload();
          }
        }

        document.addEventListener('visibilitychange', function() {
          if (document.visibilityState === 'visible') {
            checkForUpdatesOnResume();
          }
        });
        window.addEventListener('pageshow', checkForUpdatesOnResume);
        window.addEventListener('focus', checkForUpdatesOnResume);
        window.addEventListener('online', checkForUpdatesOnResume);

        // Exposição para acionamento via Dart ao iniciar o app
        window.forcarAtualizacaoPwa = function() {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistration().then(function(reg) {
              if (reg) {
                reg.update().catch(function() {});
                if (reg.waiting) {
                  reg.waiting.postMessage({type: 'SKIP_WAITING'});
                }
              }
            }).catch(function() {});
          }
        };

        // Checagem periódica silenciosa a cada 10 minutos
        setInterval(function() {
          if (swRegistration && navigator.onLine) {
            swRegistration.update().catch(function() {});
          }
        }, 10 * 60 * 1000);
      }

      // --- Proteção contra Bloqueio de Tela (Screen Wake Lock API) ---
      var wakeLockEnabled = true;
      var wakeLockSentinel = null;

      async function requestScreenWakeLock() {
        if (!wakeLockEnabled) return;
        if (!('wakeLock' in navigator)) return;
        try {
          if (wakeLockSentinel && !wakeLockSentinel.released) return;
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', function() {
            wakeLockSentinel = null;
            if (wakeLockEnabled && document.visibilityState === 'visible') {
              requestScreenWakeLock();
            }
          });
        } catch (e) {}
      }

      window.setMinhasCifrasWakeLock = function(enable) {
        wakeLockEnabled = !!enable;
        if (wakeLockEnabled) {
          requestScreenWakeLock();
        } else if (wakeLockSentinel) {
          try { wakeLockSentinel.release(); } catch (e) {}
          wakeLockSentinel = null;
        }
      };

      // --- Interceptador Universal de Pedal Bluetooth (M-VAVE VAVE368, PageFlip, AirTurn, Donner) ---
      // Solução definitiva para iPadOS (Safari e PWA instalado) sem teclado físico:
      //  1) Mantém o receptor #pedal-keyboard-sink focado com o texto "Teste" e cursor na posição 2 ("Te|ste").
      //  2) No iPadOS sem teclado físico, o pedal M-VAVE move o cursor de texto nativo (UITextInput):
      //     - Voltar música (←): cursor vai de 2 para 1 ("T|este") -> 'prev'
      //     - Próxima música (→): cursor vai de 2 para 3 ("Tes|te") -> 'next'
      //     - Subir cifra (↑): cursor vai de 2 para 0 ("|Teste") -> 'up'
      //     - Descer cifra (↓): cursor vai de 2 para 5 ("Teste|") -> 'down'
      //  3) Impede que <flt-glass-pane> / <flutter-view> roubem o foco do #pedal-keyboard-sink após o render do Flutter.
      //  4) Só foca o #pedal-keyboard-sink no fim do toque (touchend/click na fase bubble), NUNCA no touchstart,
      //     garantindo que todos os botões e opções do app respondam perfeitamente no iPad.
      window.dispatchPedalAction = null;
      window._lastPedalDebug = '';
      var SINK_WORD = 'Teste';
      var SINK_ANCHOR = 2;
      var resettingSink = false;
      var lastPedalTime = 0;
      var lastPedalAction = '';
      var lastKeyDownAt = 0;
      var lastPointerDownAt = 0;
      var userEditingText = false;

      var origFocus = HTMLElement.prototype.focus;
      var origBlur = HTMLElement.prototype.blur;

      function getSink() {
        return document.getElementById('pedal-keyboard-sink');
      }

      function isFlutterCanvasOrBody(el) {
        if (!el) return true;
        if (el === document.body || el === document.documentElement) return true;
        var tag = (el.tagName || '').toUpperCase();
        if (tag === 'FLT-GLASS-PANE' || tag === 'FLUTTER-VIEW' || tag === 'FLT-SCENE-HOST' || tag === 'CANVAS') {
          return true;
        }
        return false;
      }

      function isRealTextInput(el) {
        if (!el) return false;
        var sink = getSink();
        if (el === sink || el.id === 'pedal-keyboard-sink') return false;
        var tag = (el.tagName || '').toUpperCase();
        if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
        if (el.isContentEditable) return true;
        return false;
      }

      function resetSinkCaret() {
        var sink = getSink();
        if (!sink) return;
        resettingSink = true;
        try {
          if (sink.value !== SINK_WORD) {
            sink.value = SINK_WORD;
          }
          if (document.activeElement === sink) {
            sink.setSelectionRange(SINK_ANCHOR, SINK_ANCHOR);
          }
        } catch (e) {}
        resettingSink = false;
      }

      // Protege o foco do #pedal-keyboard-sink contra chamadas assíncronas de <flt-glass-pane>.focus()
      HTMLElement.prototype.focus = function(options) {
        var sink = getSink();
        if (this === sink) {
          return origFocus.call(this, options);
        }
        if (isRealTextInput(this)) {
          // Só permite que um input do Flutter (.flt-text-editing) tome o foco se o usuário tocou na tela recentemente
          var touchedRecently = (Date.now() - lastPointerDownAt) < 800;
          if (!touchedRecently && !userEditingText) {
            if (sink) {
              try { origFocus.call(sink, { preventScroll: true }); } catch (e) {}
              resetSinkCaret();
            }
            return;
          }
          userEditingText = true;
          return origFocus.call(this, options);
        }
        if (isFlutterCanvasOrBody(this) && sink && !userEditingText) {
          try {
            origFocus.call(sink, { preventScroll: true });
            resetSinkCaret();
            return;
          } catch (e) {}
        }
        return origFocus.call(this, options);
      };

      HTMLElement.prototype.blur = function() {
        var sink = getSink();
        if (this === sink && !userEditingText) {
          resetSinkCaret();
          return;
        }
        if (isRealTextInput(this)) {
          userEditingText = false;
        }
        return origBlur.call(this);
      };

      function ensurePedalFocus(forceEndEdit) {
        var sink = getSink();
        if (!sink) return;
        if (forceEndEdit === true) {
          userEditingText = false;
        }
        var active = document.activeElement;
        if (userEditingText && active && isRealTextInput(active)) {
          return;
        }
        userEditingText = false;
        try {
          if (document.activeElement !== sink) {
            origFocus.call(sink, { preventScroll: true });
          }
          resetSinkCaret();
        } catch (e) {}
      }

      window.addEventListener('refocuspedal', function() {
        ensurePedalFocus(true);
      });

      function mapPedalAction(key, code, keyCode) {
        // Próxima Música (ArrowRight, Numpad 6, ']', KeyCode 39, 102, 221)
        if (key === 'ArrowRight' || code === 'ArrowRight' || keyCode === 39 || keyCode === 102 || keyCode === 221 || key === ']') return 'next';
        // Música Anterior (ArrowLeft, Numpad 4, '[', KeyCode 37, 100, 219)
        if (key === 'ArrowLeft' || code === 'ArrowLeft' || keyCode === 37 || keyCode === 100 || keyCode === 219 || key === '[') return 'prev';
        // Rolar para Baixo (PageDown, ArrowDown, Numpad 2/3, 'b')
        if (key === 'PageDown' || code === 'PageDown' || key === 'ArrowDown' || code === 'ArrowDown' || keyCode === 34 || keyCode === 40 || keyCode === 98 || keyCode === 99 || keyCode === 66 || key === 'b' || key === 'B') return 'down';
        // Rolar para Cima (PageUp, ArrowUp, Numpad 8/9, 'w')
        if (key === 'PageUp' || code === 'PageUp' || key === 'ArrowUp' || code === 'ArrowUp' || keyCode === 33 || keyCode === 38 || keyCode === 104 || keyCode === 105 || keyCode === 87 || key === 'w' || key === 'W') return 'up';
        // Espaço (Modo 4)
        if (key === ' ' || code === 'Space' || keyCode === 32) return 'space';
        // Enter (Modo 4)
        if (key === 'Enter' || code === 'Enter' || code === 'NumpadEnter' || keyCode === 13) return 'enter';
        return null;
      }

      function emitDebug(obj) {
        obj.time = new Date().toLocaleTimeString();
        var payload = JSON.stringify(obj);
        window._lastPedalDebug = payload;
        window.dispatchEvent(new CustomEvent('pedaldebug', { detail: payload }));
      }

      function fireAction(action, source, e) {
        var now = Date.now();
        var debounceMs = (action === 'down' || action === 'up') ? 200 : 480;
        if ((now - lastPedalTime) < debounceMs) {
          if (e) {
            e.preventDefault();
            e.stopPropagation();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
          }
          resetSinkCaret();
          return;
        }
        lastPedalTime = now;
        lastPedalAction = action;
        if (e) {
          e.preventDefault();
          e.stopPropagation();
          if (e.stopImmediatePropagation) e.stopImmediatePropagation();
        }
        resetSinkCaret();
        window.dispatchEvent(new CustomEvent('pedalaction', { detail: action }));
      }

      // Detecta o movimento do cursor no texto "Teste" (idêntico ao app Notas do iPadOS):
      // Posição inicial: 2 ("Te|ste")
      //  - 1 ("T|este")  -> botão voltar (prev)
      //  - 3 ("Tes|te")  -> botão próximo (next)
      //  - 0 ("|Teste")  -> subir cifra (up)
      //  - >=4 ("Teste|")-> descer cifra (down)
      function checkSinkSelection() {
        if (resettingSink || userEditingText) return;
        var sink = getSink();
        if (!sink || document.activeElement !== sink) return;
        if (sink.value !== SINK_WORD) {
          resetSinkCaret();
          return;
        }
        var pos = sink.selectionStart;
        var end = sink.selectionEnd;
        if (typeof pos !== 'number' || pos === SINK_ANCHOR) return;

        var action = null;
        if (pos === SINK_ANCHOR - 1 && end === SINK_ANCHOR - 1) {
          action = 'prev';
        } else if (pos === SINK_ANCHOR + 1 && end === SINK_ANCHOR + 1) {
          action = 'next';
        } else if (pos === 0) {
          action = 'up';
        } else if (pos >= SINK_WORD.length - 1) {
          action = 'down';
        }

        resetSinkCaret();
        if (action) {
          emitDebug({ type: 'cursor_ipad', key: 'pos_' + pos, code: 'Teste', keyCode: pos, action: action });
          fireAction(action, 'cursor_ipad', null);
        }
      }

      document.addEventListener('selectionchange', checkSinkSelection);

      function processKeyEvent(e) {
        if (e.__mcHandled) return;
        e.__mcHandled = true;

        // Se o usuário estiver digitando em um campo de texto real, não intercepta
        if (userEditingText && isRealTextInput(e.target)) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;

        var key = e.key || '';
        var code = e.code || '';
        var keyCode = e.keyCode || e.which || 0;
        var isUp = e.type === 'keyup';
        var action = mapPedalAction(key, code, keyCode);

        if (isUp) {
          checkSinkSelection();
          if (!action || (Date.now() - lastKeyDownAt) < 900) return;
        } else {
          lastKeyDownAt = Date.now();
        }

        emitDebug({ type: e.type, key: key, code: code, keyCode: keyCode, action: action || 'nenhuma' });
        if (action) {
          fireAction(action, e.type, e);
        }
      }

      // Escuta em window e document (capture) para keydown e keyup
      ['keydown', 'keyup'].forEach(function(evt) {
        window.addEventListener(evt, processKeyEvent, { capture: true, passive: false });
        document.addEventListener(evt, processKeyEvent, { capture: true, passive: false });
      });

      var sinkEl = getSink();
      if (sinkEl) {
        resetSinkCaret();
        sinkEl.addEventListener('input', function(ev) {
          if (resettingSink) return;
          var data = (ev && ev.data) || '';
          resetSinkCaret();
          if (!data) return;
          var ch = data.slice(-1);
          var action = mapPedalAction(ch, '', 0);
          emitDebug({ type: 'input', key: ch, code: '', keyCode: 0, action: action || 'nenhuma' });
          if (action) fireAction(action, 'input', null);
        });
      }

      // Suporte ao Modo Mouse do M-VAVE (Modo 4): botão direito -> Próxima, botão do meio/lateral -> Anterior/Próxima
      window.addEventListener('contextmenu', function(e) {
        if (userEditingText && isRealTextInput(e.target)) return;
        emitDebug({ type: 'mouse_context', key: '', code: '', keyCode: 0, action: 'next' });
        e.preventDefault();
        e.stopPropagation();
        fireAction('next', 'contextmenu', null);
      }, { capture: true, passive: false });

      window.addEventListener('auxclick', function(e) {
        var action = null;
        if (e.button === 1 || e.button === 3) action = 'prev';
        else if (e.button === 4) action = 'next';
        if (!action) return;
        e.preventDefault();
        e.stopPropagation();
        emitDebug({ type: 'mouse_aux', key: '', code: '', keyCode: e.button, action: action });
        fireAction(action, 'auxclick', null);
      }, { capture: true, passive: false });

      // Reassume o canal do pedal sempre que o app volta ao primeiro plano
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') {
          if (wakeLockEnabled) requestScreenWakeLock();
          ensurePedalFocus(false);
        }
      });
      window.addEventListener('pageshow', function() { ensurePedalFocus(false); });
      window.addEventListener('focus', function() { ensurePedalFocus(false); });

      // Registra o instante do toque sem alterar o foco durante touchstart/pointerdown
      // (alterar foco em touchstart cancelaria os toques nos botões do Flutter no iPadOS!)
      ['touchstart', 'pointerdown', 'mousedown'].forEach(function(evt) {
        document.addEventListener(evt, function() {
          lastPointerDownAt = Date.now();
        }, { passive: true, capture: true });
      });

      // Ao finalizar o toque (touchend / click / mouseup na fase bubble, DEPOIS que o Flutter processou o botão):
      // Se o toque não abriu um campo de texto real, garante que o #pedal-keyboard-sink esteja focado com "Te|ste".
      ['touchend', 'click', 'mouseup'].forEach(function(evt) {
        document.addEventListener(evt, function(e) {
          if (wakeLockEnabled && (!wakeLockSentinel || wakeLockSentinel.released)) {
            requestScreenWakeLock();
          }
          var active = document.activeElement;
          if (isRealTextInput(e.target) || (userEditingText && isRealTextInput(active))) {
            return;
          }
          ensurePedalFocus(false);
        }, { passive: true, capture: false });
      });

      setInterval(function() {
        if (!userEditingText) {
          resetSinkCaret();
        }
      }, 600);

      setTimeout(function() { ensurePedalFocus(true); }, 600);
      window.addEventListener('flutter-first-frame', function() {
        setTimeout(function() { ensurePedalFocus(true); }, 250);
      });
      requestScreenWakeLock();
    })();
  </script>
  <script src="flutter_bootstrap.js" defer></script>
</body>
