<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/minhascifras-web/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="App de cifras com setlists, acordes editáveis, karaokê e modo 100% offline.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Minhas Cifras">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Minhas Cifras</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Service Worker para funcionamento 100% offline -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js?v=main-1793808551', { scope: './' })
        .then(function(reg) {
          console.log('[MinhasCifras] Service Worker offline ativo:', reg.scope);
          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
          reg.onupdatefound = function() {
            var installing = reg.installing;
            if (installing) {
              installing.onstatechange = function() {
                if (installing.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('[MinhasCifras] Nova versão pronta em cache offline.');
                }
              };
            }
          };
        })
        .catch(function(err) {
          console.warn('[MinhasCifras] Falha ao registrar Service Worker:', err);
        });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
