<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Teste do Pedal - Minhas Cifras</title>
  <style>
    body { font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 20px; background: #111; color: #eee; }
    h1 { font-size: 20px; margin: 0 0 6px; }
    p { color: #aaa; font-size: 14px; line-height: 1.4; }
    #status { padding: 14px; border-radius: 12px; margin: 14px 0; font-weight: 700; font-size: 16px; background: #442; }
    #status.ok { background: #143; }
    button { font-size: 18px; padding: 14px 22px; border-radius: 12px; border: 0; background: #6a4fb3; color: #fff; }
    #big { font-size: 56px; text-align: center; padding: 26px 0; min-height: 70px; }
    #log { font-family: ui-monospace, Menlo, monospace; font-size: 12px; white-space: pre-wrap; color: #9f9; max-height: 40vh; overflow: auto; }
    #sink { position: fixed; top: 0; left: 0; width: 1px; height: 1px; opacity: 0.01; border: none; padding: 0; margin: 0; }
  </style>
</head>
<body>
  <input id="sink" type="text" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
  <h1>Teste do Pedal Bluetooth</h1>
  <p>1) Toque no botão abaixo. 2) Pise no pedal. Cada pisada deve aparecer aqui com o nome da tecla e a ação.
     Se nada aparecer, o iPad não está entregando as teclas do pedal ao navegador (é uma configuração do pedal/iOS, não do app).</p>
  <button id="btn">Ativar captura do pedal</button>
  <div id="status">Aguardando toque no botão…</div>
  <div id="big">–</div>
  <div id="log"></div>
  <script>
    var sink = document.getElementById('sink');
    var status = document.getElementById('status');
    var big = document.getElementById('big');
    var log = document.getElementById('log');
    var count = 0;
    function refresh() {
      var on = document.activeElement === sink;
      status.textContent = on ? 'Captura ATIVA – pise no pedal' : 'Captura INATIVA – toque no botão';
      status.className = on ? 'ok' : '';
    }
    function write(e) {
      count++;
      var line = count + ' ' + e.type + ' key="' + (e.key || '') + '" code="' + (e.code || '') + '" keyCode=' + (e.keyCode || 0);
      big.textContent = (e.key || e.type);
      log.textContent = line + '\n' + log.textContent;
    }
    document.getElementById('btn').addEventListener('click', function() {
      try { sink.focus({ preventScroll: true }); } catch (err) {}
      refresh();
    });
    ['keydown', 'keyup'].forEach(function(t) {
      window.addEventListener(t, function(e) { write(e); e.preventDefault(); }, true);
    });
    sink.addEventListener('input', function(e) { log.textContent = 'input data="' + e.data + '"\n' + log.textContent; sink.value = ''; });
    setInterval(refresh, 500);
    document.addEventListener('touchend', function() { try { sink.focus({ preventScroll: true }); } catch (err) {} refresh(); }, true);
  </script>
</body>
</html>
